<!doctype html><title>env</title>
<script>
function r() {
  var vv = window.visualViewport;
  document.title = ["outer=" + window.outerWidth + "x" + window.outerHeight, "inner=" + window.innerWidth + "x" + window.innerHeight,
    "screen=" + screen.width + "x" + screen.height, "avail=" + screen.availWidth + "x" + screen.availHeight,
    "dpr=" + window.devicePixelRatio, "vvScale=" + (vv ? vv.scale : "none"), "colorDepth=" + screen.colorDepth,
    "mm2x=" + window.matchMedia("(-webkit-min-device-pixel-ratio: 2)").matches, "hover=" + window.matchMedia("(hover: hover)").matches].join(" ");
}
r(); setInterval(r, 400);
</script>
