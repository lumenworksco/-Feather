name: Feather
options:
  bundleIdPrefix: dev.feather
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_HARDENED_RUNTIME: YES
    # The public half of the key that signs updates (tools/new-update-key.sh). Empty = this build refuses every update.
    UPDATE_PUBLIC_KEY: "Gib8r8dHJvHB9sTs3eDY9risFp/pXMZ8lqDKEnXNCeQ="
targets:
  Feather:
    type: application
    platform: macOS
    sources: [Feather, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.feather.Feather
        CODE_SIGN_ENTITLEMENTS: Feather/Feather.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FeatherUpdater
        embed: true
        codeSign: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Library
    info:
      path: Feather/Info.plist
      properties:
        CFBundleDisplayName: Feather
        FeatherUpdatePublicKey: $(UPDATE_PUBLIC_KEY)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Websites you open in Feather can ask to use your camera (for example video calls).
        NSMicrophoneUsageDescription: Websites you open in Feather can ask to use your microphone (for example video calls).
        NSLocationUsageDescription: Websites you open in Feather can ask for your location (for example maps).
        NSLocationWhenInUseUsageDescription: Websites you open in Feather can ask for your location (for example maps).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.feather.tab
            UTTypeDescription: Feather tab
            UTTypeConformsTo: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: Web address
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
  FeatherUpdater:
    type: application
    platform: macOS
    sources: [FeatherUpdater, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.feather.Feather.Updater
        PRODUCT_NAME: FeatherUpdater
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FeatherUpdater/Info.plist
      properties:
        CFBundleDisplayName: Feather Updater
        LSUIElement: true
        FeatherUpdatePublicKey: $(UPDATE_PUBLIC_KEY)
